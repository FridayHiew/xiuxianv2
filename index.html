<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>修仙人生</title>
<meta name="description" content="文字修仙RPG角色扮演模拟器，开辟道途，修习心法法术，炼丹历练，探索宗门与机缘冒险。">
<meta property="og:title" content="修仙人生">
<meta property="og:description" content="文字修仙RPG角色扮演模拟器，开辟道途，修习心法法术，炼丹历练，探索宗门与机缘冒险。">
<link rel="stylesheet" href="css/reset.css?v=6">
<link rel="stylesheet" href="css/theme.css?v=6">
<link rel="stylesheet" href="css/layout.css?v=6">
<link rel="stylesheet" href="css/components.css?v=6">
</head>
<body>
<div id="app">
  <!-- 顶部仙韵制御条（音频、日志、GM工具与创角顶栏） -->
  <div class="top-utility-header" id="topUtilityHeader">
    <div class="top-utility-left">
      <span class="game-brand-seal">修仙人生</span>
      <span class="game-brand-sub" id="topHeaderSub">一念逍遥 · 水墨修真</span>
    </div>
    <div class="top-bar-actions">
      <div class="icon-btn log-icon" id="logIcon" onclick="openLog()" title="机缘日志">📜
        <span class="badge" id="logBadge">0</span>
      </div>
      <div class="audio-widget" id="audioWidget">
        <div class="icon-btn audio-btn muted" id="audioBtn" onclick="onAudioBtnClick(event)" title="仙乐控制 (点击播放/静音，点齿轮调音量)">
          <span id="audioIcon">🔇</span>
          <span class="audio-gear" onclick="openAudioSettings(event)" title="调音量/换曲风">⚙</span>
        </div>
        <div class="audio-popover" id="audioPopover" style="display:none;">
          <div class="popover-header">
            <span class="popover-title">仙音渺渺 · 背景仙乐</span>
            <button class="popover-close" id="audioPopoverClose" onclick="openAudioSettings(event, false)" title="关闭">✕</button>
          </div>
          <div class="popover-body">
            <div class="audio-row">
              <span class="label">状态:</span>
              <button class="btn-toggle-play inactive" id="btnAudioTogglePlay" onclick="toggleAudio()">
                静音中 (点击播放)
              </button>
            </div>
            <div class="audio-row volume-row">
              <span class="label">音量:</span>
              <input type="range" min="0" max="100" value="60" id="audioVolumeSlider" class="volume-slider" oninput="onAudioVolumeChange(this.value)">
              <span class="volume-num" id="audioVolumeNum">60%</span>
            </div>
            <div class="theme-select-section">
              <div class="section-subtitle">曲风意境</div>
              <div class="theme-pills">
                <button class="theme-pill active" data-theme="fairy" onclick="onAudioThemeClick('fairy')">清幽雅韵</button>
                <button class="theme-pill" data-theme="guqin" onclick="onAudioThemeClick('guqin')">云水抚琴</button>
                <button class="theme-pill" data-theme="zen" onclick="onAudioThemeClick('zen')">九霄入定</button>
              </div>
              <div class="theme-desc" id="audioThemeDesc">古筝与竹笛交织，如穿行于仙山翠竹之间</div>
            </div>
          </div>
        </div>
      </div>
      <div class="icon-btn" id="adminIcon" onclick="openAdmin()" title="数据维护">🔧</div>
      <div class="icon-btn" id="profileIcon" onclick="switchTab('profile')" title="道体人物">道</div>
    </div>
  </div>

  <!-- 创角：开辟道途 -->
  <div id="creationPanel" class="panel creation-container">
    <div class="creation-hero-card">
      <img src="./src/assets/images/cultivator_avatar_1792114545622.jpg" alt="悟道者" referrerPolicy="no-referrer">
      <div class="creation-hero-overlay">
        <div class="creation-hero-quote">「世人皆求长生术，不知长生本在心。」</div>
        <div class="creation-hero-sub">凡胎争渡，逆天修道。立道号，定生辰，踏上属于你的长生仙路。</div>
      </div>
    </div>

    <div class="creation-form-card">
      <div class="creation-row">
        <label for="nameInput">道号</label>
        <div class="input-with-action">
          <input id="nameInput" value="云逸" maxlength="8" style="flex:1;">
          <button type="button" class="small" onclick="randomizeName()" title="随机道号">🎲 赐名</button>
        </div>
      </div>
      <div class="creation-row">
        <label for="genderInput">道身</label>
        <select id="genderInput" style="flex:1;">
          <option value="男">乾道 (男)</option>
          <option value="女">坤道 (女)</option>
        </select>
      </div>
      <div class="creation-row">
        <label>生辰</label>
        <div style="flex:1; display:flex; gap:6px;">
          <select id="monthInput" style="flex:1;"></select>
          <select id="dayInput" style="flex:1;"></select>
        </div>
      </div>
      <p class="small" style="margin:4px 0 0; color:var(--text-dim);">
        生辰将深远影响你的五行命格、性格悟性与初始气运。灵根灵体与宗门道统将在入门后逐一展现。
      </p>
      <div style="margin-top:10px;">
        <button class="primary block" onclick="createCharacter()">
          ⚔️ 踏入仙途 · 开始修仙
        </button>
      </div>
    </div>
  </div>

  <!-- 游戏主画面：一念逍遥式水墨全屏布局 -->
  <div id="gameArea" style="display:none;">
    <div class="status-bar" id="statusBar"></div>
    <div class="panel main-stage-panel" id="panelContent"></div>
    <nav class="tabs bottom-seal-nav" id="tabs" aria-label="主导航"></nav>
  </div>
</div>

<div id="battleScreen" class="battle-screen"></div>
<div id="battleSubmenu" class="battle-submenu"></div>
<div class="modal-mask" id="modalMask"><div class="modal" id="modalBox"></div></div>
<div class="modal-mask" id="profileMask"><div class="profile-modal" id="profileBox"></div></div>
<div class="modal-mask" id="logMask"><div class="log-modal" id="logBox"></div></div>

<!-- ========== 冒险地全屏界面 ========== -->
<div id="adventureScreen" class="adventure-screen" style="display:none;">
  <div class="adventure-header">
    <h1 id="advTitle">🌲 冒险地</h1>
    <div class="sub" id="advSub">第 1 层</div>
  </div>

  <div class="path-bar" id="advPathBar"></div>

  <div class="event-area">
    <div class="event-card" id="advEventCard"></div>
  </div>

  <div class="choice-area">
    <div class="choice-title">下一步</div>
    <div class="choice-list" id="advChoiceList"></div>
  </div>

  <div class="adv-footer">
    <button onclick="onAdvLeave()" class="adv-leave-btn">离开冒险地</button>
  </div>
</div>


<!-- ========== 秘境全屏界面 ========== -->
<div id="secretScreen" class="secret-screen" style="display:none;">
  <div class="secret-header">
    <h1 id="secretTitle">📜 秘境</h1>
    <div class="progress" id="secretSub"></div>
  </div>
  <div class="story-area">
    <div class="story-card" id="secretCard"></div>
  </div>
  <div class="choice-area">
    <div class="choice-list" id="secretChoiceList"></div>
  </div>
</div>


<!-- ========== Admin 数据维护全屏界面 ========== -->
<div id="adminScreen" class="admin-screen" style="display:none;"></div>
